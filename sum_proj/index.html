<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Main</title>
    <link rel="stylesheet" href="index-style.css">
    <link rel="stylesheet" href="header-style.css">
</head>
<body>

    <!-- Header/Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="pic/logo.png" alt="ChatGPT Logo">
                <span>ChatGPT ▾</span>
            </div>
            <nav class="center-nav">
                <a href="index.html">Main</a>
                <a href="images.html">Images</a>
                <a href="agent.html">Agent</a>
    
            </nav>
            <div class="right-actions">
                <button class="btn-login">Log in</button>
                <button class="btn-signup">Sign up for free</button>
                <button class="btn-help">?</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            <h1>What's on the agenda today?</h1>

            <!-- Input Form -->
            <form class="prompt-form">
                <div class="input-group">
                    <input type="text" placeholder="Ask anything">
                </div>
                <div class="form-actions">
                    <button class="action-item"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%23666' d='M4.33 1.58a5.29 5.29 0 0 1 7.49 0l5.83 5.83a5.29 5.29 0 0 1-7.49 7.49l-7.08-7.08A3.53 3.53 0 0 1 6 2.99l7.08 7.08a1.76 1.76 0 1 0 2.5-2.5l-5.83-5.83a3.53 3.53 0 0 0-5 5L8.5 16.5a1.76 1.76 0 0 0 2.5-2.5L3.58 6.67a5.29 5.29 0 0 1 0-5.09Z'/></svg>" alt="Attach"> Attach</button>
                    <button class="action-item"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%23666' d='M10 0a10 10 0 1 0 0 20A10 10 0 0 0 10 0Zm9 10a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-8.33v4.33a1 1 0 0 1-2 0V7.67a3.33 3.33 0 1 1 4.95 2.9L13.74 12h-3.41a1 1 0 0 1 0-2h3.59l.8-.81a5.33 5.33 0 1 0-5.18 3.94Z'/></svg>" alt="Search"> Search</button>
                    <button class="action-item"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%23666' d='M18 2a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h16ZM3 4v12h4V4H3Zm6 0v12h8V4H9Z'/></svg>" alt="Study"> Study</button>
                    <button class="action-item"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%23666' d='M16 2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h12Zm-2 4H6v2h8V6Zm0 4H6v2h8v-2Zm0 4H6v2h8v-2Z'/></svg>" alt="Create image"> Create image</button>
                </div>
            </form>


        </div>
    </main>

</body>
</html>
