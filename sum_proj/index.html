<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Main</title>
    <link rel="stylesheet" href="index-style.css">
    <link rel="stylesheet" href="header-style.css">
</head>
<body>

    <!-- Header/Navigation -->
    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="pic/logo.png" alt="ChatGPT Logo">
                <span>ChatGPT ▾</span>
            </div>
            <nav class="center-nav">
                <a href="index.html">Main</a>
                <a href="images.html">Images</a>
                <a href="agent.html">Agent</a>
    
            </nav>
            <div class="right-actions">
                <button class="btn-login">Log in</button>
                <button class="btn-signup">Sign up for free</button>
                <button class="btn-help">?</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            <h1>What's on the agenda today?</h1>

            <!-- Input Form -->
            <form class="prompt-form">
                <div class="input-group">
                    <input type="text" placeholder="Ask anything">
                </div>
                <div class="form-actions">
                    <button class="action-item"><img src="pic/ic1.png" alt="Attach"> Attach</button>
                    <button class="action-item"><img src="pic/ic2.png" alt="Search"> Search</button>
                    <button class="action-item"><img src="pic/ic3.png" alt="Study"> Study</button>
                    <button class="action-item"><img src="pic/ic4.png" alt="Create image"> Create image</button>
                    <button class="action-item right"><img src="pic/ic5.png" alt="Voice"> Voice</button>
                </div>
            </form>


        </div>
    </main>

</body>
</html>
